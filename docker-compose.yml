name: ethio-tour-national

services:
  postgres:
    image: postgis/postgis:16-3.5
    profiles: [core, app]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" &&
          PGPASSWORD="$${POSTGRES_PASSWORD}" psql -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -tAc
          "SELECT PostGIS_Full_Version()" | grep -qi postgis
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7.4.2-alpine
    profiles: [core, app]
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.21.8
    profiles: [core, app]
    restart: unless-stopped
    environment:
      MP_SMTP_BIND_ADDR: 0.0.0.0:1025
      MP_UI_BIND_ADDR: 0.0.0.0:8025
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: [CMD-SHELL, nc -z 127.0.0.1 8025]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
    profiles: [core, app]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: [CMD, curl, -f, http://127.0.0.1:9000/minio/health/live]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.2
    profiles: [identity]
    restart: unless-stopped
    command: [start-dev, --import-realm]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?Set KEYCLOAK_ADMIN in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HEALTH_ENABLED: 'true'
      KC_METRICS_ENABLED: 'false'
    ports:
      - '${KEYCLOAK_PORT:-8080}:8080'
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./infra/keycloak/realm.local.json:/opt/keycloak/data/import/ethio-tour-local-realm.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://127.0.0.1:9000/health/ready >/dev/null
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  meilisearch:
    image: getmeili/meilisearch:v1.12.8
    profiles: [search]
    restart: unless-stopped
    environment:
      MEILI_ENV: development
    ports:
      - '${MEILISEARCH_PORT:-7700}:7700'
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: [CMD, curl, -f, http://127.0.0.1:7700/health]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
      args:
        APP_NAME: api
    profiles: [app]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      RUN_MIGRATIONS: 'true'
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      REDIS_URL: redis://redis:6379
      MAILPIT_SMTP_HOST: mailpit
      MAILPIT_SMTP_PORT: 1025
      MINIO_ENDPOINT: http://minio:9000
      KEYCLOAK_ISSUER_URL: http://keycloak:8080/realms/ethio-tour-local
      MEILISEARCH_URL: http://meilisearch:7700
    ports:
      - '${API_PORT:-4000}:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:4000/api/health').then((r) =>
          process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
      args:
        APP_NAME: worker
    profiles: [app]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      REDIS_URL: redis://redis:6379
      MAILPIT_SMTP_HOST: mailpit
      MAILPIT_SMTP_PORT: 1025
      MINIO_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "const fs=require('node:fs'); const live=fs.readdirSync('/proc').filter((entry)=>/^[0-9]+$/.test(entry)).some((pid)=>{try{return fs.readFileSync('/proc/'+pid+'/cmdline','utf8').includes('dist/main.js')}catch{return false}}); process.exit(live?0:1)"
      interval: 10s
      timeout: 3s
      retries: 10

  public-web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        APP_NAME: public-web
    profiles: [app]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:4000/api
      PORT: 3000
    ports:
      - '${PUBLIC_WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000').then((r) =>
          process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  workspace-web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        APP_NAME: workspace-web
    profiles: [app]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:4000/api
      PORT: 3001
    ports:
      - '${WORKSPACE_WEB_PORT:-3001}:3001'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3001').then((r) =>
          process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  postgres_data:
  redis_data:
  minio_data:
  keycloak_data:
  meilisearch_data:
